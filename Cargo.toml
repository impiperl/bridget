[package]
name = "bridget"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.191"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
signal-hook = "0.4.5"
toml = "1.1.8"
unicode-width = "0.2.2"
vt100 = "0.18.1"

[dev-dependencies]
libc = "0.2.191"
nix = { version = "0.28", features = ["term"] }
